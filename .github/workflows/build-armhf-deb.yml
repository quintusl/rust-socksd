name: Build armhf Debian Package

on:
  push:
    tags:
      - 'v*.*.*' # Trigger on version tags like v1.0.0, v1.2.3, etc.

jobs:
  build-armhf:
    name: Build armhf Debian Package
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install QEMU static binaries so Docker can run ARM containers
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      # 2. Run the build inside an armhf Debian container with proper platform support
      - name: Build Debian package
        run: |
          docker run --rm \
            --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            debian:trixie \
            /bin/bash -c "
              # Update and install build dependencies (matching amd64 build)
              apt-get update &&
              apt-get install -y --no-install-recommends \
                build-essential \
                debhelper \
                dpkg-dev \
                pkg-config \
                libssl-dev \
                libpam0g-dev \
                devscripts \
                equivs \
                git \
                ca-certificates \
                curl

              # Install Rust via rustup
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
              . \$HOME/.cargo/env
              rustup update stable
              rustup toolchain install stable

              # Automatically install dependencies listed in debian/control
              mk-build-deps --install --remove --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y' debian/control

              # Build the package (unsigned source, unsigned changes, binary-only)
              dpkg-buildpackage -us -uc -b

              # Move the resulting .deb files into a specific folder for uploading
              mkdir -p /workspace/output
              mv ../*.deb /workspace/output/ || true
            "

      # 3. Upload the compiled .deb file to the release
      - name: Upload armhf package to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          # Find the .deb file
          DEB_FILE=$(find output -name "*_armhf.deb" -o -name "*_arm*.deb" | head -1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::Could not find .deb package for armhf"
            ls -la output/ || true
            exit 1
          fi
          echo "Found deb package: $DEB_FILE"
          if [ -z "$TAG_NAME" ]; then
            echo "::error::TAG_NAME is empty"
            exit 1
          fi
          gh release upload "$TAG_NAME" "$DEB_FILE"
