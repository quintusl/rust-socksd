name: Build Debian Package (armhf) with QEMU

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build_debian_armhf:
    name: Build Debian Package (armhf)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get version and package name
        id: get_version
        run: |
          export PKG_NAME=$(grep -A 10 '\[package\]' Cargo.toml | grep '^name *=' | sed 's/name *= *"\(.*\)"/\1/')
          export VERSION=$(grep -A 10 '\[package\]' Cargo.toml | grep '^version *=' | sed 's/version *= *"\(.*\)"/\1/')
          echo "pkg_name=${PKG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Install cross-compilation toolchain for armhf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dpkg-dev \
            pkg-config \
            gcc-arm-linux-gnueabihf \
            g++-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            libssl-dev:armhf \
            libpam0g-dev:armhf \
            crossbuild-essential-armhf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-gnueabihf

      - name: Build Debian Package for armhf
        env:
          DEB_BUILD_GNU_TYPE: arm-linux-gnueabihf
          DEB_HOST_GNU_TYPE: arm-linux-gnueabihf
          DEB_HOST_ARCH: armhf
          CARGO_BUILD_TARGET: armv7-unknown-linux-gnueabihf
          RUSTFLAGS: "-C linker=arm-linux-gnueabihf-gcc"
          CC: arm-linux-gnueabihf-gcc
          CXX: arm-linux-gnueabihf-g++
          AR: arm-linux-gnueabihf-ar
          PKG_CONFIG_PATH: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
        run: |
          set -e
          echo "Building for: $(dpkg-architecture -A armhf -q DEB_HOST_GNU_TYPE)"
          dpkg-buildpackage -b -uc -us -a armhf
          ls -la *.deb || echo "::warning::No .deb files found"

      - name: Upload Debian package to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Find the .deb file for armhf
          DEB_PATH=$(find . -maxdepth 1 -name "*_armhf.deb" -print -quit)
          if [ -z "$DEB_PATH" ]; then
            echo "::error::Could not find .deb package for armhf"
            ls -l
            exit 1
          fi
          echo "Found deb package: $DEB_PATH"
          gh release upload ${{ env.TAG_NAME }} "$DEB_PATH"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debian-armhf-package
          path: "*.deb"
          retention-days: 30
